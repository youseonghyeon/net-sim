apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-sim
  labels:
    app: net-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: net-sim
  template:
    metadata:
      labels:
        app: net-sim
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx-unprivileged 이미지의 nginx 사용자 (uid/gid 101)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: net-sim
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (set by CI)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged 는 pid 와 temp 파일을 /tmp 에 쓴다
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
