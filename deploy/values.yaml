image:
  repository: ghcr.io/youseonghyeon/net-sim
  # CI가 main push마다 커밋 SHA로 갱신한다. 첫 CI 전에는 latest.
  tag: "be89cfc9bce86aadfe4ca165d8a74731029a036d"
  pullPolicy: IfNotPresent

# ghcr 패키지가 private이면 pull secret 이름을 넣는다. public이면 비워 둔다.
imagePullSecrets: []

service:
  port: 8080


resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
