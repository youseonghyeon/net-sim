name: CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

concurrency:
  group: cicd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 게이트: 타입 검사 + 코어 테스트 (브라우저 스모크 ui-check 는 로컬에서만)
      - name: Typecheck and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 이 실행 중에 main 에 새 커밋이 올라와도 거절되지 않게: 최신 main 위에서 태그를 다시 쓰고 push (앞 실행의 봇 커밋과 같은 줄이라 rebase 대신).
      # 실행은 concurrency 로 차례로 돌므로 나중 커밋의 실행이 뒤에 와서 그 태그로 덮는다
      - name: Update image tag in Helm values and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            sed -i 's|^  tag: .*|  tag: "${{ github.sha }}"|' deploy/values.yaml
            git add deploy/values.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci: update image tag to ${{ github.sha }}"
            if git push origin HEAD:main; then exit 0; fi
            echo "push 거절 (main 이 그사이 바뀜) — 다시 시도 ${attempt}/3"
            sleep 5
          done
          exit 1
